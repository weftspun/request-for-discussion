name: Checks

on:
  pull_request:
  merge_group:
  # A push to main is the "just-merged" edge, which is where the
  # orphan-branch gate has something new to look at. Every other job in
  # this file guards itself with an `if:` for the trigger it wants.
  push:
    branches: [main]
  schedule:
    # Nightly sweep for orphans, so a branch pushed to after its merge
    # gets caught the next day rather than at the next unrelated push.
    - cron: "17 5 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prek:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # The double-join hook is `language: system` and shells out to elixir, so the runner
      # needs a BEAM before prek starts. Pinned rather than floated for the same reason
      # `usd-core` is: a toolchain bump should arrive as a diff somebody approves.
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"
      - run: pip install prek
      - run: prek run --all-files --show-diff-on-failure --color always

  # THE GOAL-MANIFEST GATE IS A CI JOB AND NOT A PREK HOOK, AND THE REASON IS THE TOKEN.
  #
  # It asks the GitHub organisation which repositories are archived, so it needs network and
  # credentials. prek hooks get neither by contract -- they run on a developer's machine against
  # files -- so wiring it there would produce a hook that fails for everyone without a token and
  # gets skipped into uselessness.
  #
  # This is the failure the gate was written against, committed once already: it shipped with two
  # firing controls and nothing that ran it, which is a gate that certifies nothing while looking
  # official in the tree.
  #
  # UNREACHABLE IS A FAILURE HERE, NOT A SKIP. The script exits non-zero when it cannot read the
  # org, so a network outage turns this job red rather than green. That is deliberate: a gate
  # that goes quiet when it cannot check reports exactly what a passing gate reports.
  goal-manifests:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # ONE INVOCATION, AND IT RUNS BOTH. `--self-test` performs the real check against
      # CLAUDE.md first and the two negative controls after, exiting non-zero if either half
      # fails. An earlier draft of this step described it as "controls first", copying the
      # ordering `weftspun-keypoint`'s gates.yml uses -- which is not what this script does.
      # A comment that describes a different program is worse than none.
      - name: the rule names a live manifest, and the controls still fire
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_goal_manifests.py --self-test

  # THE THREE RFD GATES. `weftspun/logbook` and `weftspun/request-for-discussion` were
  # two repositories and are one, so this file is two workflows. The prek job above is
  # the logbook's, which pins Elixir 1.18 where the RFD half pinned 1.17. One repository
  # gets one toolchain, and the bump is here rather than in a later surprise.
  rfd-numbers:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # The self-test runs first. A gate that cannot reject a known-bad tree
      # certifies the defect, so it proves itself before it judges the repo.
      - run: python scripts/check-rfd-numbers.py --self-test
      - run: python scripts/check-rfd-numbers.py

  rfd-serials:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The register is held against its own previous revision, so the
          # base commit has to be in the checkout. A shallow clone has no
          # previous revision and the comparison would silently do nothing.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/check-rfd-serials.py --self-test
      - run: python scripts/check-rfd-serials.py --base origin/${{ github.event.pull_request.base.ref || 'main' }}

  rfd-structure:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # The CommonMark parser is the one dependency these gates take, and it
      # is pinned. RFD 1124 says why the AST is worth it.
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/check-rfd-structure.py --self-test
      - run: python scripts/check-rfd-structure.py

  # THE SITE PAGES ARE GENERATED, so nothing here checks that they are committed --
  # it checks that regenerating them changes nothing. A README edited without the
  # renderer being run would otherwise publish the old text under the new title.
  site-pages:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install usd-core==26.8
      - run: python scripts/render_site.py --self-test
      - run: python scripts/render_site.py --check

  # THE COMMENT LADDER, A JOB RATHER THAN A prek HOOK ALONE, AND THE REASON IS THE BASE.
  #
  # The gate is diff-based. `prek run --all-files` stages nothing, so the hook above sees
  # an empty change set in CI and reports a green run for a check it did not perform --
  # the silent skip CLAUDE.md rule 3 calls a FAIL. This job names the base explicitly.
  #
  # fetch-depth 0 for the same reason `rfd-serials` needs it: the gate reads each changed
  # file at the base revision, and a shallow clone has no base revision to read.
  comment-ladder:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # Controls first: three of the five must reject known-broken input.
      - run: python scripts/check_comment_ladder.py --self-test
      - run: python scripts/check_comment_ladder.py --base origin/${{ github.event.pull_request.base.ref || 'main' }}

  # Trope density did not rise. Same diff-based shape as comment-ladder,
  # narrower scope (rfd/*/README.md, rfd/*/DETAILS.md, logbook/*.md) so the
  # working agreements that carry named tells verbatim stay off it.
  trope-density:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python scripts/check_tropes.py --self-test
      - run: python scripts/check_tropes.py --base origin/${{ github.event.pull_request.base.ref || 'main' }}

  # THE PR DESCRIPTION, WHICH ONLY EXISTS ON A PULL REQUEST.
  #
  # `if:` rather than a skip inside the script: a push to main has no description to read,
  # and a job that reports green for a check it did not perform is rule 3's silent skip.
  # GitHub records the job as skipped, which does not read as a pass.
  pr-description:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # Controls first: four of the five must reject known-broken input.
      - run: python scripts/check_pr_description.py --self-test
      - run: python scripts/check_pr_description.py ${{ github.event.pull_request.number }}
        env:
          GH_TOKEN: ${{ github.token }}

  # EVERY NEW RFD CARRIES THE CANARY SENTENCE, which is the workspace's M&M's clause.
  # An AI that read `CLAUDE.md` before drafting adds the sentence; one that skipped it
  # will not, and this gate catches the omission. Scoped to RFD directories that did
  # not exist on the base branch, so existing RFDs are outside the trap and human-only
  # drafts add nothing they cannot truthfully attest.
  rfd-canary:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python scripts/check_rfd_canary.py --self-test
      - run: python scripts/check_rfd_canary.py --base origin/${{ github.event.pull_request.base.ref || 'main' }}

  # MERGED PR HEAD BRANCHES SHOULD NOT LINGER on the remote. `delete_branch_on_merge`
  # is the primary control; this gate is the backstop for the case where the branch
  # gained a commit after the PR merged and GitHub therefore left it. Runs on push to
  # main (the just-merged edge) and nightly. Not on `pull_request`, because the check
  # is about the remote's post-merge state and a PR run reports nothing new.
  no-orphaned-branches:
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python scripts/check_no_orphaned_branches.py --self-test
      - run: python scripts/check_no_orphaned_branches.py --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
