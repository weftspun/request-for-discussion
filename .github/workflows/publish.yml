name: Publish

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        run: pip install usd-core==26.8

      # The pages are generated, never committed. A render without this step
      # publishes an index of nothing, which reads exactly like an empty site.
      - name: Render RFD pages and the serial register
        run: python scripts/render_site.py

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: TeX for the PDF build
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - run: quarto render

      # The book renders separately: its aggregated .qmd is generated by
      # render_site.py and its EPUB and PDF outputs land beside the site so the
      # navbar links resolve. Render errors on the PDF are non-fatal here
      # because a missing PDF is a broken link, not a broken site.
      - name: Render the book (EPUB + PDF)
        run: |
          quarto render book.qmd --to epub --output book.epub
          quarto render book.qmd --to pdf  --output book.pdf || true
          mv book.epub _site/book.epub
          mv book.pdf  _site/book.pdf  || true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
