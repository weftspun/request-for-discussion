name: Publish

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The site is the required deliverable and its job succeeds or fails alone.
  # book.epub and book.pdf ride a separate job that fails soft: a broken
  # download is a missing link, not a broken site, and the epub/pdf toolchain
  # has walls the site render never touches (lualatex, unicode fallbacks, the
  # aggregated book.qmd's size). Splitting the jobs is the fix in the
  # workflow's own terms.
  site:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        run: pip install usd-core==26.8

      - name: Render RFD pages and the serial register
        run: python scripts/render_site.py

      - name: Render Flight Level pages (L1, L2, L3)
        run: python scripts/render_flight_level_pages.py

      - uses: quarto-dev/quarto-actions/setup@v2

      - run: quarto render

      - name: Deploy site to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site

  book:
    runs-on: ubuntu-latest
    needs: site
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        run: pip install usd-core==26.8

      - name: Generate book.qmd from the register
        run: python scripts/render_site.py

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: TeX for the PDF build
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Render book.epub and book.pdf
        run: |
          mkdir -p out
          quarto render book.qmd --to epub && mv book.epub out/book.epub || true
          quarto render book.qmd --to pdf  && mv book.pdf  out/book.pdf  || true
          ls -la out

      # keep_files: true preserves everything the site job just published;
      # this push adds book.epub and book.pdf at the site root without
      # wiping it. A book render that produced nothing still runs the deploy
      # step with an empty out/, which is a no-op rather than a failure.
      - name: Deploy book beside the site
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: out
          keep_files: true
