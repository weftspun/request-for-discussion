# Runs with prek, which reads the pre-commit config format.
#
#   prek install
#   prek run --all-files
#
# Moved here from weftspun-3d-studio's own .pre-commit-config.yaml
# when decisions/ itself moved to this repository. The Elixir hooks
# cover the RECTGTN HTN domains and problems that sit beside their
# RFDs (0037 records why those files are Elixir DSL); the
# dockerfile-and-server hook covers the model-image build sources
# that sit beside theirs (0036 gives the rules).
repos:
  - repo: local
    hooks:
      - id: mix-format
        name: mix format (taskweft domains)
        description: >-
          Formats */*.ex against .formatter.exs. A domain is real
          Elixir, thus the formatter is the first check it passes.
        entry: mix format --check-formatted
        language: system
        files: '^\d{4}-.*\.exs?$'
        pass_filenames: false

      - id: elixir-parses
        name: elixir parses (taskweft domains)
        description: >-
          Rejects a domain that is not valid Elixir. The formatter
          catches this as well, and this hook names the failure.
        entry: elixir scripts/check-elixir-parses.exs
        language: system
        files: '^\d{4}-.*\.exs?$'

      - id: dockerfile-and-server
        name: model images parse
        description: >-
          Each model folder carries a Dockerfile and a server.py.
          RFD 0036 gives the rules, and a broken server.py fails much
          later, on a rented GPU.
        entry: python scripts/check-model-images.py
        language: system
        files: '^\d{4}-.*/(Dockerfile|server\.py|test_input\.json)$'

  # Markdown hygiene. Structural only, deliberately.
  #
  # RFD 0063 moves ASD-STE100 enforcement to the simplified-technical-english
  # plugin, and says why no repository-local script duplicates it. These hooks
  # therefore check nothing about the prose. They check the bytes: a trailing
  # space that a diff shows and a reader cannot see, a missing final newline
  # that makes the next commit touch a line nobody edited, and a CRLF that
  # arrives from a Windows checkout and rewrites a whole file.
  #
  # Scoped to markdown. The Elixir and model-image hooks above own their own
  # file types, and a hook that reformats somebody else's is a hook that
  # widens without being asked.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        files: '\.md$'
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
        files: '\.md$'
      - id: mixed-line-ending
        files: '\.md$'
        args: [--fix=lf]
