project:
  type: website
  output-dir: _site
  # Each RFD is `NNNN-slug/README.md`, and Quarto excludes README.md from
  # rendering by default -- only an exact path beats that, and a hand-kept list
  # of 159 of them is the drift `multiplayer-fabric-manuals` already paid for.
  # `scripts/render_site.py` writes `NNNN-slug/index.md` beside each README and
  # the glob below picks them up, so there is no list to fall behind.
  render:
    - "**/*.qmd"
    - "**/*.md"
    - "!README.md"
    - "!CLAUDE.md"
    - "!AGENTS.md"
    - "!BLOCKLIST.md"
    - "!KEYPOINTS.md"
    - "!PITFALLS.md"

website:
  site-url: https://weftspun.github.io/request-for-discussion
  repo-url: https://github.com/weftspun/request-for-discussion
  repo-branch: main
  repo-actions: [edit, source]
  title: "Taskweft — Manuals"
  description: "Request-for-Discussion documents, the serial register, and the logbook."
  page-navigation: true
  navbar:
    background: primary
    search: true
    left:
      - text: "Flight Levels"
        menu:
          - text: "L1 · Operations"
            file: pages/flight-level-1-operations.qmd
          - text: "L2 · Coordination"
            file: pages/flight-level-2-coordination.qmd
          - text: "L3 · Strategy"
            file: pages/flight-level-3-strategy.qmd
      - text: "Logbook"
        file: pages/logbook.qmd
      - text: "Register"
        file: pages/serials.md
  page-footer:
    left: "Serials are OID arcs under the 66606 PEN and are never reused."
    right:
      - icon: github
        href: https://github.com/weftspun/request-for-discussion

format:
  html:
    toc: true
    theme:
      light: [flatly, rfd-sheet.scss]
      dark: [darkly, rfd-sheet.scss]
    code-copy: true

freeze: true
